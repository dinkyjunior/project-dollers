<svg xmlns="http://www.w3.org/2000/svg" width="1315" height="1197" viewBox="0 0 1315 1197" fill="none">
  <title>Continuous polished steel entrance with sapphire optical channel</title>
  <desc>Original scalable implementation artwork, not a crop of the approved chat render. One connected casting with no joints, segments, rivets or pedestal. Geometry: ellipse opening centre 657.5,528 and radii 510,450; optical channel radii 539,478; lower bowl ends at y1167. Neutral chrome remains separate from blue optical material for fixed sport recolouring. No raster, player, logo or venue is embedded.</desc>
  <defs>
    <path id="casting" fill-rule="evenodd" d="M657.5 26C960 26 1241 244 1275 569C1289 710 1276 852 1217 955C1148 1093 974 1167 657.5 1167C341 1167 167 1093 98 955C39 852 26 710 40 569C74 244 355 26 657.5 26Z M657.5 78A510 450 0 1 0 657.5 978A510 450 0 1 0 657.5 78Z"/>
    <path id="outer-profile" d="M657.5 26C960 26 1241 244 1275 569C1289 710 1276 852 1217 955C1148 1093 974 1167 657.5 1167C341 1167 167 1093 98 955C39 852 26 710 40 569C74 244 355 26 657.5 26Z"/>
    <mask id="casting-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1315" height="1197"><use href="#casting" fill="white"/></mask>
    <!-- Continuous curved reflection coordinates; no flat bands or columns. -->
    <radialGradient id="chrome" cx="657.5" cy="528" r="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#303030"/>
      <stop offset=".67" stop-color="#303030"/>
      <stop offset=".735" stop-color="#626262"/>
      <stop offset=".803" stop-color="#979797"/>
      <stop offset=".839" stop-color="#cecece"/>
      <stop offset=".855" stop-color="#fafafa"/>
      <stop offset=".871" stop-color="#b8b8b8"/>
      <stop offset=".905" stop-color="#737373"/>
      <stop offset=".953" stop-color="#393939"/>
      <stop offset="1" stop-color="#151515"/>
    </radialGradient>
    <radialGradient id="curved-reflection-left" cx="129" cy="736" r="365" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 -294.4) scale(1 1.4)">
      <stop stop-color="#fff" stop-opacity=".64"/>
      <stop offset=".32" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".66" stop-color="#fff" stop-opacity=".095"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="curved-reflection-right" cx="1186" cy="709" r="372" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 -283.6) scale(1 1.4)">
      <stop stop-color="#fff" stop-opacity=".62"/>
      <stop offset=".34" stop-color="#fff" stop-opacity=".36"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="polished-rim" x1="0" y1="0" x2="980" y2="1120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6f6f6"/>
      <stop offset=".22" stop-color="#b3b3b3"/>
      <stop offset=".4" stop-color="#292929"/>
      <stop offset=".58" stop-color="#e7e7e7"/>
      <stop offset=".79" stop-color="#6b6b6b"/>
      <stop offset="1" stop-color="#d6d6d6"/>
    </linearGradient>
    <linearGradient id="steel-inner" x1="657.5" y1="66" x2="657.5" y2="990" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7e7e7"/>
      <stop offset=".16" stop-color="#363636"/>
      <stop offset=".36" stop-color="#acacac"/>
      <stop offset=".52" stop-color="#e2e2e2"/>
      <stop offset=".76" stop-color="#2e2e2e"/>
      <stop offset=".9" stop-color="#bcbcbc"/>
      <stop offset="1" stop-color="#f4f4f4"/>
    </linearGradient>
    <radialGradient id="glass-refraction" cx="657.5" cy="528" r="563" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 59.7508) scale(1 .88682746)">
      <stop offset=".87" stop-color="#020616"/>
      <stop offset=".925" stop-color="#031443"/>
      <stop offset=".942" stop-color="#0a278e"/>
      <stop offset=".951" stop-color="#163dcc"/>
      <stop offset=".961" stop-color="#3869ff"/>
      <stop offset=".974" stop-color="#2250db"/>
      <stop offset=".98" stop-color="#12328d"/>
      <stop offset=".994" stop-color="#020a2a"/>
      <stop offset="1" stop-color="#000515"/>
    </radialGradient>
    <linearGradient id="glass-direction" x1="130" y1="230" x2="1200" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1943bf" stop-opacity=".12"/>
      <stop offset=".12" stop-color="#497fff" stop-opacity=".64"/>
      <stop offset=".29" stop-color="#001743" stop-opacity=".12"/>
      <stop offset=".51" stop-color="#020e34" stop-opacity=".4"/>
      <stop offset=".7" stop-color="#163bb4" stop-opacity=".14"/>
      <stop offset=".86" stop-color="#4273ff" stop-opacity=".54"/>
      <stop offset="1" stop-color="#00102e" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="sapphire-edge" x1="82" y1="345" x2="1226" y2="767" gradientUnits="userSpaceOnUse">
      <stop stop-color="#093093"/>
      <stop offset=".12" stop-color="#5f94ff"/>
      <stop offset=".35" stop-color="#1037b6"/>
      <stop offset=".52" stop-color="#264fea"/>
      <stop offset=".79" stop-color="#1746df"/>
      <stop offset=".94" stop-color="#6697ff"/>
      <stop offset="1" stop-color="#163d9d"/>
    </linearGradient>
    <filter id="glass-glow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="optical-core-glow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3" result="glow"/><feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- All silhouette and surface layers share one continuous casting mask. -->
  <use href="#casting" fill="url(#chrome)"/>
  <use href="#casting" fill="url(#curved-reflection-left)"/>
  <use href="#casting" fill="url(#curved-reflection-right)"/>
  <g mask="url(#casting-mask)">
    <use href="#outer-profile" stroke="#040404" stroke-width="10"/>
    <use href="#outer-profile" stroke="url(#polished-rim)" stroke-width="4.4"/>
    <!-- Deep recess and refracting royal-blue glass are one closed loop. -->
    <ellipse cx="657.5" cy="528" rx="539" ry="478" stroke="#030710" stroke-width="45"/>
    <ellipse cx="657.5" cy="528" rx="560" ry="499" stroke="url(#polished-rim)" stroke-width="3.6"/>
    <ellipse cx="657.5" cy="528" rx="539" ry="478" stroke="#215bff" stroke-width="50" opacity=".64" filter="url(#glass-glow)"/>
    <ellipse cx="657.5" cy="528" rx="539" ry="478" stroke="url(#glass-refraction)" stroke-width="36"/>
    <ellipse cx="657.5" cy="528" rx="539" ry="478" stroke="url(#glass-direction)" stroke-width="32"/>
    <ellipse cx="657.5" cy="528" rx="539" ry="478" stroke="#507cff" stroke-width="9" opacity=".6" filter="url(#optical-core-glow)"/>
    <ellipse cx="657.5" cy="528" rx="539" ry="478" stroke="#e8eeff" stroke-width="4.3" filter="url(#optical-core-glow)"/>
    <ellipse cx="657.5" cy="528" rx="539" ry="478" pathLength="1000" stroke="#f3f6ff" stroke-width="5.8" stroke-dasharray="11 989" stroke-dashoffset="-135" stroke-linecap="round" filter="url(#optical-core-glow)"/>
    <ellipse cx="657.5" cy="528" rx="539" ry="478" pathLength="1000" stroke="#edf2ff" stroke-width="5.4" stroke-dasharray="15 985" stroke-dashoffset="-643" stroke-linecap="round" opacity=".96" filter="url(#optical-core-glow)"/>
    <ellipse cx="657.5" cy="528" rx="553.5" ry="492.5" stroke="url(#sapphire-edge)" stroke-width="2.6" opacity=".87"/>
    <ellipse cx="657.5" cy="528" rx="525" ry="464" stroke="#08298e" stroke-width="2.1"/>
    <!-- A bevel, rather than a flat outline, seats the open venue inside. -->
    <ellipse cx="657.5" cy="528" rx="516" ry="456" stroke="#080808" stroke-width="14"/>
    <ellipse cx="657.5" cy="528" rx="516" ry="456" stroke="url(#steel-inner)" stroke-width="9"/>
    <ellipse cx="657.5" cy="528" rx="511" ry="451" stroke="#080808" stroke-width="2"/>
    <ellipse cx="657.5" cy="528" rx="521" ry="461" stroke="url(#polished-rim)" stroke-width="1.3" opacity=".8"/>
  </g>
</svg>
