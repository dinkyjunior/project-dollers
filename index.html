<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Dollar$</title>
<style>
:root{--bg:#050816;--card:#0b1230;--line:#1d4ed8;--glow:#38bdf8;--gold:#fbbf24;--tx:#e5edff;--mu:#8da2c9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(#0a1a4a,#02040d);color:var(--tx);font:14px system-ui,sans-serif;padding-bottom:70px}
main{max-width:430px;margin:0 auto;padding:12px}
#ribbon{background:#b45309;color:#fff;text-align:center;font-weight:700;padding:5px;font-size:12px}
h1,h2,h3{margin:8px 0}.logo{font:italic 900 34px system-ui;text-align:center;color:var(--gold);text-shadow:0 0 14px #38bdf8}
.card,.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 0 12px #1d4ed855}
.tile{display:block;text-align:center;color:var(--tx);text-decoration:none;font-weight:800}.soon{opacity:.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.tabs button,select{background:#0b1230;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700}
.tabs button.on{background:var(--gold);color:#000;box-shadow:0 0 10px var(--gold)}
table{width:100%;border-collapse:collapse}th,td{padding:6px 4px;text-align:right;border-bottom:1px solid #16224f}th:first-child,td:first-child,td.l,th.l{text-align:left}th{color:var(--mu);font-size:12px}
a{color:var(--glow);text-decoration:none}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.mu{color:var(--mu);font-size:12px}
.b{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;border:2px solid #fff3;overflow:hidden;flex:none}.b img{width:100%;height:100%;object-fit:contain;background:#fff}
.big{font-size:34px;font-weight:900}.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}.odds div{border:1px solid var(--line);border-radius:10px;padding:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#070d26;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav a{color:var(--mu);font-size:12px;text-align:center}nav a.on{color:var(--gold)}
</style></head><body>
<div id="ribbon"></div><main id="app"></main><nav id="nav"></nav>
<script>
const T=[["ARI","Cardinals","NFC","West","#97233F"],["ATL","Falcons","NFC","South","#A71930"],["BAL","Ravens","AFC","North","#241773"],["BUF","Bills","AFC","East","#00338D"],["CAR","Panthers","NFC","South","#0085CA"],["CHI","Bears","NFC","North","#0B162A"],["CIN","Bengals","AFC","North","#FB4F14"],["CLE","Browns","AFC","North","#FF3C00"],["DAL","Cowboys","NFC","East","#003594"],["DEN","Broncos","AFC","West","#FB4F14"],["DET","Lions","NFC","North","#0076B6"],["GB","Packers","NFC","North","#203731"],["HOU","Texans","AFC","South","#03202F"],["IND","Colts","AFC","South","#002C5F"],["JAX","Jaguars","AFC","South","#006778"],["KC","Chiefs","AFC","West","#E31837"],["LV","Raiders","AFC","West","#A5ACAF"],["LAC","Chargers","AFC","West","#0080C6"],["LAR","Rams","NFC","West","#003594"],["MIA","Dolphins","AFC","East","#008E97"],["MIN","Vikings","NFC","North","#4F2683"],["NE","Patriots","AFC","East","#002244"],["NO","Saints","NFC","South","#D3BC8D"],["NYG","Giants","NFC","East","#0B2265"],["NYJ","Jets","AFC","East","#125740"],["PHI","Eagles","NFC","East","#004C54"],["PIT","Steelers","AFC","North","#FFB612"],["SF","49ers","NFC","West","#AA0000"],["SEA","Seahawks","NFC","West","#69BE28"],["TB","Buccaneers","NFC","South","#D50A0A"],["TEN","Titans","AFC","South","#4B92DB"],["WAS","Commanders","NFC","East","#5A1414"]];
const TM={};T.forEach(t=>TM[t[0]]={id:t[0],name:t[1],conf:t[2],div:t[3],color:t[4]});
let D,DEMO=true,wk=1,tab="ladder",conf="AFC",filt="ALL",ptab="stats",P={};
const A=document.getElementById("app");
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const dec=m=>m==null?"–":(m>0?1+m/100:1+100/-m).toFixed(2);
const sgn=n=>(n>0?"+":"")+n;
function demo(){let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 const ids=T.map(t=>t[0]),pos=["QB","RB","RB","WR","WR","TE"],players=[],games=[];
 ids.forEach(a=>pos.forEach((p,i)=>players.push({id:a+i,name:"Sample "+p+" "+(i+1)+" ("+a+")",team:a,pos:p,no:i+1,log:[]})));
 const byT={};players.forEach(p=>(byT[p.team]=byT[p.team]||[]).push(p));
 let o=ids.slice();
 for(let w=1;w<=5;w++){o.push(o.splice(1,1)[0]);
  for(let i=0;i<16;i++){const a=o[i],h=o[31-i],sp=Math.round((r()*14-7)*2)/2,pl=w<=4;
   const g={id:"g"+w+"_"+i,wk:w,away:a,home:h,date:new Date(2026,8,10+7*(w-1)).toDateString(),time:"1:00 PM ET",venue:TM[h].name+" home field",
    as:pl?10+Math.floor(r()*25):null,hs:pl?10+Math.floor(r()*25):null,spread:sp,ml_h:sp>0?-Math.round(110+sp*25):Math.round(100-sp*20),ml_a:sp>0?Math.round(100+sp*20):-Math.round(110-sp*25)};
   games.push(g);
   if(pl)[[a,h],[h,a]].forEach(([t,op])=>byT[t].forEach(p=>{const e={wk:w,opp:op,py:0,pt:0,ry:0,rt:0,rc:0,cy:0,ct:0};
    if(p.pos=="QB"){e.py=Math.round(180+r()*180);e.pt=Math.floor(r()*4)}
    else if(p.pos=="RB"){e.ry=Math.round((p.no==2?40:10)+r()*80);e.rt=r()<.25?1:0;e.rc=Math.floor(r()*4);e.cy=e.rc*7}
    else{e.rc=Math.floor(2+r()*6);e.cy=Math.round(e.rc*(8+r()*8));e.ct=r()<.2?1:0}
    p.log.push(e)}));}}
 return{teams:null,games,players};}
function ensure(){Object.keys(TM).forEach(k=>TM[k].logo&&0);P={};D.players.forEach(p=>P[p.id]=p);
 if(D.teams)D.teams.forEach(t=>Object.assign(TM[t.id]||(TM[t.id]={id:t.id,name:t.id,conf:"",div:"",color:"#334"}),t));
 const done=D.games.filter(g=>g.hs!=null);wk=done.length?Math.max(...done.map(g=>g.wk)):1;}
function badge(t){const x=TM[t]||{color:"#334"};return `<span class="b" style="background:${x.color}">${x.logo?`<img src="${x.logo}" onerror="this.remove()">`:""}${x.logo?"":t}</span>`}
function link(h,t,c){return `<a href="#/${h}" ${c?`class="${c}"`:""}>${t}</a>`}
function rec(w){const r={};Object.keys(TM).forEach(k=>r[k]={w:0,l:0,t:0,pf:0,pa:0,s:[]});
 D.games.filter(g=>g.hs!=null&&g.wk<=w).sort((a,b)=>a.wk-b.wk).forEach(g=>[[g.home,g.hs,g.as],[g.away,g.as,g.hs]].forEach(([t,f,a])=>{const x=r[t];if(!x)return;x.pf+=f;x.pa+=a;const k=f>a?"W":f<a?"L":"T";x[k.toLowerCase()]++;x.s.push(k)}));
 Object.values(r).forEach(x=>{x.n=x.w+x.l+x.t;x.pct=x.n?(x.w+x.t/2)/x.n:0});return r}
function strk(x){if(!x.s.length)return"–";const l=x.s[x.s.length-1];let n=0;for(let i=x.s.length-1;i>=0&&x.s[i]==l;i--)n++;return l+n}
function tot(p){const s={py:0,pt:0,ry:0,rt:0,rc:0,cy:0,ct:0};p.log.forEach(e=>Object.keys(s).forEach(k=>s[k]+=e[k]||0));return s}
function role(p){const key=p.pos=="QB"?"py":p.pos=="RB"?"ry":"cy";const m=D.players.filter(q=>q.team==p.team&&q.pos==p.pos).sort((a,b)=>tot(b)[key]-tot(a)[key]);const i=m.indexOf(p);
 return p.pos=="QB"||p.pos=="TE"?(i?"Backup":"Starter"):p.pos=="RB"?(i?"Backup":"Primary"):"WR"+(i+1)}
function weekSel(){const mx=Math.max(...D.games.map(g=>g.wk));let o="";for(let i=1;i<=mx;i++)o+=`<option ${i==wk?"selected":""}>${i}</option>`;return `<select onchange="wk=+this.value;go()">${o}</select>`}
function tabs(arr,cur,fn){return `<div class="tabs">${arr.map(([k,l])=>`<button class="${k==cur?"on":""}" onclick="${fn}('${k}')">${l}</button>`).join("")}</div>`}
function gameRow(g){const pl=g.hs!=null;return `<a href="#/game/${g.id}" class="card row" style="color:inherit">${badge(g.away)}<b>${g.away}</b><span class="sp" style="text-align:center">${pl?`<b class="big" style="font-size:20px">${g.as} – ${g.hs}</b>`:`<span class="mu">${g.date}<br>${g.time}</span>`}</span><b>${g.home}</b>${badge(g.home)}</a>`}
const V={
home(){return `<div class="logo">PROJECT DOLLAR$</div><div class="mu" style="text-align:center">SPORTS DATA & RESEARCH</div><div class="grid"><a class="tile" href="#/nfl">🏈<br>NFL<br><span class="mu">Stats · Teams · Matchups</span></a><div class="tile soon">NBA<br><span class="mu">COMING SOON</span></div><div class="tile soon">NRL<br><span class="mu">COMING SOON</span></div><div class="tile soon">UFC<br><span class="mu">COMING SOON</span></div></div>`},
nfl(){const r=rec(wk);let h=`<div class="row"><h2 class="sp">NFL</h2>Week ${weekSel()}</div>${tabs([["ladder","LADDER"],["top","TOP PLAYERS"],["recap","WEEKLY RECAP"]],tab,"setTab")}`;
 if(tab=="ladder"){h+=tabs([["AFC","AFC"],["NFC","NFC"]],conf,"setConf")+`<div class="card"><table><tr><th>#</th><th class="l">TEAM</th><th>W</th><th>L</th><th>PCT</th><th>STRK</th></tr>`+
  Object.keys(TM).filter(k=>TM[k].conf==conf).sort((a,b)=>r[b].pct-r[a].pct||(r[b].pf-r[b].pa)-(r[a].pf-r[a].pa)).map((k,i)=>`<tr><td>${i+1}</td><td class="l">${badge(k)} ${link("team/"+k,TM[k].name)}</td><td>${r[k].w}</td><td>${r[k].l}</td><td>${r[k].pct.toFixed(3)}</td><td>${strk(r[k])}</td></tr>`).join("")+`</table><div class="mu">Ordered by win % then points difference. Official NFL tiebreakers not applied.</div></div>`}
 if(tab=="top"){[["QB","py","pt","PASS YDS"],["RB","ry","rt","RUSH YDS"]].forEach(([ps,k,tk,lab])=>{const L=D.players.filter(p=>p.pos==ps).map(p=>({p,e:p.log.find(e=>e.wk==wk)})).filter(x=>x.e).sort((a,b)=>b.e[k]-a.e[k]).slice(0,5);
  h+=`<div class="card"><b>TOP 5 ${ps}s (WEEK ${wk})</b><table><tr><th>#</th><th class="l">PLAYER</th><th>${lab}</th><th>TD</th></tr>${L.map((x,i)=>`<tr><td>${i+1}</td><td class="l">${link("player/"+x.p.id,x.p.name)}</td><td>${x.e[k]}</td><td>${x.e[tk]}</td></tr>`).join("")}</table></div>`})}
 if(tab=="recap")h+=D.games.filter(g=>g.wk==wk).map(gameRow).join("");
 return h},
teams(){let h="<h2>Teams</h2>";["AFC","NFC"].forEach(c=>["East","North","South","West"].forEach(d=>{h+=`<div class="card"><b>${c} ${d}</b>`+Object.keys(TM).filter(k=>TM[k].conf==c&&TM[k].div==d).map(k=>`<div class="row" style="margin-top:8px">${badge(k)}${link("team/"+k,TM[k].name)}</div>`).join("")+`</div>`}));return h},
team(id){const t=TM[id],r=rec(99)[id],sub=ptab=="roster"||!["roster","sched","stats"].includes(ptab)?"roster":ptab;
 let h=`<div class="row">${badge(id)}<div><h2 style="margin:0">${t.name}</h2><span class="mu">${r.w}-${r.l}${r.t?"-"+r.t:""} · ${t.conf} ${t.div}</span></div></div>${tabs([["roster","Roster"],["sched","Schedule"],["stats","Team Stats"]],sub,"setPt")}`;
 if(sub=="roster"){h+=tabs(["ALL","QB","RB","WR","TE"].map(x=>[x,x]),filt,"setFilt")+D.players.filter(p=>p.team==id&&(filt=="ALL"||p.pos==filt)).map(p=>{const s=tot(p);const st=p.pos=="QB"?`${s.py} pass yds`:p.pos=="RB"?`${s.ry} rush yds`:`${s.cy} rec yds`;return `<a href="#/player/${p.id}" class="card row" style="color:inherit"><span class="mu">#${p.no||""}</span><div class="sp"><b>${p.name}</b><br><span class="mu">${p.pos} · ${role(p)}</span></div><b>${st}</b></a>`}).join("")+`<div class="mu">Role label is based on season yards, not an official depth chart.</div>`}
 if(sub=="sched")h+=D.games.filter(g=>g.home==id||g.away==id).sort((a,b)=>a.wk-b.wk).map(gameRow).join("");
 if(sub=="stats"){const n=r.n||1;h+=`<div class="card"><table><tr><td class="l">Points per game</td><td>${f1(r.pf/n)}</td></tr><tr><td class="l">Points allowed per game</td><td>${f1(r.pa/n)}</td></tr><tr><td class="l">Games played</td><td>${r.n}</td></tr></table></div>`}
 return h},
player(id){const p=P[id];if(!p)return"<p>Player not found</p>";const s=tot(p),n=p.log.length;
 const cols=p.pos=="QB"?[["py","PASS YDS"],["pt","TD"]]:p.pos=="RB"?[["ry","RUSH YDS"],["rt","TD"],["rc","REC"],["cy","REC YDS"]]:[["rc","REC"],["cy","REC YDS"],["ct","TD"]];
 return `<div class="card"><div class="row">${badge(p.team)}<div><h2 style="margin:0">${p.name}</h2><span class="mu">${p.pos} · ${link("team/"+p.team,TM[p.team].name)} · ${role(p)}</span></div></div></div>
 <div class="card"><b>SEASON</b><table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr><tr>${cols.map(c=>`<td style="text-align:center;font-size:20px;font-weight:800">${s[c[0]]}</td>`).join("")}</tr></table><div class="mu">${n} games</div></div>
 <div class="card"><b>GAME LOG</b><table><tr><th>WK</th><th class="l">OPP</th>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr>${p.log.slice().reverse().map(e=>`<tr><td>${e.wk}</td><td class="l">${e.opp}</td>${cols.map(c=>`<td>${e[c[0]]}</td>`).join("")}</tr>`).join("")}</table></div>`},
game(id){const g=D.games.find(x=>x.id==id);if(!g)return"<p>Game not found</p>";const pl=g.hs!=null,r=rec(g.wk-1),n=k=>r[k].n||1;
 let h=`<div class="card"><div class="mu" style="text-align:center">${g.away} @ ${g.home} · Week ${g.wk}<br>${g.date} · ${g.time}<br>${g.venue||""}</div><div class="row" style="justify-content:space-around;margin-top:10px">${link("team/"+g.away,badge(g.away))}<span class="big">${pl?g.as+" – "+g.hs:"VS"}</span>${link("team/"+g.home,badge(g.home))}</div>${pl?`<div class="mu" style="text-align:center">FINAL</div>`:""}</div>`;
 if(g.temp!=null||g.roof)h+=`<div class="card"><b>Conditions</b><br>${g.temp!=null?Math.round((g.temp-32)*5/9)+"°C":""} ${g.wind!=null?"· wind "+Math.round(g.wind*1.609)+" km/h":""} ${g.roof?"· "+g.roof:""}</div>`;
 if(g.spread!=null||g.ml_h!=null)h+=`<div class="card"><b>Pre-game odds</b><div class="odds"><div>${g.away}<br><b>${g.spread!=null?sgn(g.spread):"–"}</b><br>${dec(g.ml_a)}</div><div>${g.home}<br><b>${g.spread!=null?sgn(-g.spread):"–"}</b><br>${dec(g.ml_h)}</div></div><div class="mu">Spread and decimal moneyline. ${DEMO?"SAMPLE numbers.":"Source: historical data file; recorded lines."}</div></div>`;
 h+=`<div class="card"><b>Team comparison (before this game)</b><table><tr><th class="l"></th><th>${g.away}</th><th>${g.home}</th></tr><tr><td class="l">Record</td><td>${r[g.away].w}-${r[g.away].l}</td><td>${r[g.home].w}-${r[g.home].l}</td></tr><tr><td class="l">Points per game</td><td>${f1(r[g.away].pf/n(g.away))}</td><td>${f1(r[g.home].pf/n(g.home))}</td></tr><tr><td class="l">Points allowed</td><td>${f1(r[g.away].pa/n(g.away))}</td><td>${f1(r[g.home].pa/n(g.home))}</td></tr></table></div>`;
 if(pl)h+=`<div class="card"><b>Top performers</b><table>${[g.away,g.home].map(t=>{const q=D.players.filter(p=>p.team==t).map(p=>({p,e:p.log.find(e=>e.wk==g.wk)})).filter(x=>x.e);const best=(k)=>q.sort((a,b)=>b.e[k]-a.e[k])[0];const a=best("py"),b=best("ry");return `<tr><td class="l">${t} passing</td><td class="l">${a?link("player/"+a.p.id,a.p.name)+" "+a.e.py:"–"}</td></tr><tr><td class="l">${t} rushing</td><td class="l">${b?link("player/"+b.p.id,b.p.name)+" "+b.e.ry:"–"}</td></tr>`}).join("")}</table></div>`;
 return h},
matchups(){return `<div class="row"><h2 class="sp">Matchups</h2>Week ${weekSel()}</div>`+D.games.filter(g=>g.wk==wk).map(gameRow).join("")},
insights(){return `<h2>Insights</h2><div class="card">Predictions are paused. This tab is reserved for tested, honest probability work later.</div>`},
more(){return `<h2>More</h2><div class="card">Data mode: <b>${DEMO?"SAMPLE (invented numbers)":"REAL data.json"}</b><br><span class="mu">To show real stats, place a data.json file next to this page. Images fall back to coloured badges.</span></div>`}};
function setTab(t){tab=t;go()}function setConf(c){conf=c;go()}function setFilt(f){filt=f;go()}function setPt(t){ptab=t;go()}
function go(){const[p,a]=location.hash.replace(/^#\/?/,"").split("/");const k=p||"home";
 document.getElementById("ribbon").textContent=DEMO?"SAMPLE DATA – numbers are invented, not real NFL stats":"";document.getElementById("ribbon").style.display=DEMO?"block":"none";
 A.innerHTML=(V[k]||V.home)(a);
 document.getElementById("nav").innerHTML=[["","Home"],["teams","Teams"],["matchups","Matchups"],["insights","Insights"],["more","More"]].map(([h,l])=>`<a href="#/${h}" class="${(k==(h||"home")||(k=="team"&&h=="teams")||(k=="nfl"&&h==""))?"on":""}">${l}</a>`).join("")}
async function init(){D=demo();try{const r=await fetch("data.json");if(r.ok){const j=await r.json();if(j.games&&j.players){D=j;DEMO=false}}}catch(e){}
 ensure();window.onhashchange=go;go()}
if(typeof document!=="undefined"&&document.getElementById("app").tagName)init();
</script></body></html>
