name: Refresh independent NFL standings

on:
  schedule:
    # Source-backed official order is checked every hour, independently of research.
    - cron: '9 * * * *'
    - cron: '17 19 * * *'
    # Tuesday midnight America/New_York is 04 UTC in EDT / 05 UTC in EST.
    # Fetch at both candidates to tolerate DST and delayed GitHub scheduling.
    - cron: '0 4,5 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-nfl-standings.yml'
      - 'scripts/refresh-standings.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: nfl-standings-refresh
  cancel-in-progress: false

jobs:
  standings:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          # Fetch only pipeline inputs; preserve the full repository on origin.
          # Sparse checkout automatically uses partial clone (blob:none).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/refresh-standings.py
            /scripts/verify-pages-deployment.py
            /qa/standings.test.py
            /index.html
            /404.html
            /assets/*.js
            /assets/*.css
            /assets/data/*.json
      - name: Fetch and validate standings independently of player research
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          # A producer release must actually exercise production source retrieval.
          # Tuesday runs force a fresh official order at the NY browsing rollover.
          if [ "$SCHEDULE" = "17 19 * * *" ] || [ "$SCHEDULE" = "0 4,5 * * 2" ] || [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--force)
          fi
          python3 scripts/refresh-standings.py "${args[@]}"
          python3 scripts/refresh-standings.py --check
          python3 qa/standings.test.py
      # Any retrieval, official-ranking or validation error stops here. The
      # preceding published file remains intact; there is no synthetic fallback.
      - name: Publish validated standings
        id: publish
        run: |
          if git diff --quiet -- assets/data/standings.json; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/standings.json
          git commit -m 'Refresh source-backed NFL standings'
          git pull --rebase origin main
          python3 scripts/refresh-standings.py --check
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Deploy and verify updated standings
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          python3 scripts/verify-pages-deployment.py --commit "$(git rev-parse HEAD)"
