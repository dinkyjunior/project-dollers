name: Refresh verified NFL data

on:
  schedule:
    # Hourly fallback, with additional 15-minute checks around verified NFL
    # kickoffs and the provider's daily release windows. Cron can be delayed.
    - cron: '7 * * * *'
    - cron: '22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Fetch and validate all current source files even when their validators match'
        type: boolean
        required: false
        default: false
      refresh_history:
        description: 'Re-fetch historical season files to incorporate any archival corrections'
        type: boolean
        required: false
        default: false
  # Ready for a future authorized provider/webhook relay. No relay is currently
  # connected; the event payload is never evaluated as shell code or app data.
  repository_dispatch:
    types: [nfl-data-updated]

permissions:
  contents: write
  pages: write

concurrency:
  group: nfl-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Check provider availability without downloading unchanged datasets
        id: sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FORCE_REFRESH: ${{ inputs.force_refresh }}
          REFRESH_HISTORY: ${{ inputs.refresh_history }}
        run: |
          args=(--event "$EVENT_NAME" --cron "$SCHEDULE" --github-output "$GITHUB_OUTPUT")
          if [ "$FORCE_REFRESH" = "true" ] || [ "$REFRESH_HISTORY" = "true" ]; then
            args+=(--force)
          fi
          python3 scripts/check-source-updates.py "${args[@]}"
      - name: Fetch and validate public source data
        if: steps.sources.outputs.should_refresh == 'true'
        env:
          REFRESH_HISTORY: ${{ inputs.refresh_history }}
        run: |
          pd_source_cache="$RUNNER_TEMP/project-dollar-source-cache"
          pd_matchup_evidence="$RUNNER_TEMP/project-dollar-matchup-evidence"
          args=(--cache-dir "$pd_source_cache")
          if [ "$REFRESH_HISTORY" = "true" ]; then
            args+=(--refresh-history)
          fi
          python3 scripts/refresh-data.py "${args[@]}"
          python3 scripts/refresh-data.py --check
          python3 scripts/refresh-team-details.py --cache-dir "$pd_source_cache"
          python3 scripts/refresh-team-details.py --check
          python3 scripts/refresh-matchup-breakdown.py --cache-dir "$pd_source_cache" --evidence-dir "$pd_matchup_evidence"
          python3 scripts/refresh-matchup-breakdown.py --check
          python3 qa/team-details/data.test.py --cache-dir "$pd_source_cache"
          python3 qa/matchup-breakdown/data.test.py --source-manifest "$pd_matchup_evidence/source-manifest.json"
          python3 qa/matchup-breakdown/source-monitor.test.py
          python3 qa/data.test.py
          python3 qa/source-updates.test.py
      - name: Publish the validated snapshot
        id: publish
        if: steps.sources.outputs.should_refresh == 'true'
        run: |
          if git diff --quiet -- assets/data/current.json assets/data/provenance.json assets/data/player-history.json assets/data/team-details.json assets/data/matchup-breakdown.json; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/current.json assets/data/provenance.json assets/data/player-history.json assets/data/team-details.json assets/data/matchup-breakdown.json
          git commit -m 'Refresh verified NFL snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not trigger the automatic branch Pages build.
      # Request that build explicitly for the configured main / root source.
      - name: Rebuild the published GitHub Pages site
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
